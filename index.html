<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Học Đường</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'vt323': ['VT323', 'monospace'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Màn hình Loading -->
    <div id="loading-screen" class="hidden">
        <div class="loading-content">
            <div class="loading-header">
                <h1 class="blink">LOADING...</h1>
                <!-- Ảnh gif pixel học sinh đang chạy -->
                <img src="./running_student.jpg" class="pixel-runner" alt="Học sinh chạy">
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p id="loading-text">Đang tải dữ liệu...</p>
        </div>
    </div>

    <div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('arcade_school_bg.jpg'); filter: brightness(0.85);"></div>

    <!-- Lớp phủ tạo hiệu ứng màn hình tivi lồi CRT cũ -->
    <div class="crt-overlay z-10"></div>
    
    <div class="bg-white pixel-border-blue relative flex flex-col items-center p-8 z-20 shadow-pixel-heavy text-black max-w-2xl w-full mx-4 mt-8">
        <div class="absolute -top-12 z-20 text-6xl drop-shadow-md animate-bounce">🕹️</div>

        <div class="school-info text-center mb-6 border-b-4 border-dashed border-gray-300 w-full pb-4">
            <h2 class="text-4xl text-pink-600 font-bold drop-shadow-[2px_2px_0px_rgba(0,0,0,0.5)]">TH&THCS SUỐI BU</h2>
            <h3 class="text-2xl text-gray-700 font-bold mt-2">Giáo Viên Hoàng Thị Hồng</h3>
        </div>
        
        <header class="mb-8 relative flex justify-center w-full">
            <div class="pixel-banner-blue text-5xl text-white px-10 py-3 shadow-pixel animate-pulse">ARCADE HỌC ĐƯỜNG</div>
        </header>

        <main class="join-room flex flex-col items-center w-full">
            <h2 class="text-3xl text-blue-700 font-bold mb-4 drop-shadow-sm">NHẬP MÃ PHÒNG ĐỂ KẾT NỐI</h2>
            
            <div class="flex flex-col items-center gap-4 relative">
                <!-- Decorative elements -->
                <div class="absolute -left-16 top-2 text-4xl animate-bounce" style="animation-delay: 0.2s">🪙</div>
                <div class="absolute -right-16 top-2 text-4xl animate-bounce" style="animation-delay: 0.5s">🪙</div>
                <div class="absolute -left-12 bottom-2 text-3xl animate-pulse">⭐</div>
                <div class="absolute -right-12 bottom-2 text-3xl animate-pulse">⭐</div>

                <input type="text" id="pin-input" placeholder="MÃ 4 SỐ" maxlength="4" autocomplete="off" 
                       class="pixel-input text-5xl text-center p-4 w-64 uppercase focus:bg-blue-50 focus:outline-none">
                
                <button onclick="joinRoom()" class="pixel-btn-yellow text-black text-4xl px-12 py-4 mt-2 w-64 hover:brightness-110">
                    KẾT NỐI
                </button>
                <p id="join-error" class="text-red-500 text-2xl font-bold mt-2 hidden">Mã phòng không tồn tại!</p>
            </div>
        </main>

        <footer class="mt-10 flex flex-col items-center">
            <p class="blink text-gray-500 text-xl font-bold mb-4">AWAITING SIGNAL...</p>
            <a href="admin.html" class="text-gray-400 hover:text-blue-500 text-xl underline">[ Quản trị viên (Giáo viên) Tạo Phòng ]</a>
        </footer>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        function joinRoom() {
            const pin = document.getElementById('pin-input').value.trim();
            if(pin.length !== 4) return;
            
            // Hiện loading... (Dùng lại màn hình loading có sẵn trong html)
            document.getElementById('loading-screen').classList.remove('hidden');
            document.getElementById('loading-screen').style.display = 'flex';
            setTimeout(() => { document.getElementById('loading-screen').style.opacity = '1'; }, 10);
            
            db.ref('rooms/' + pin).once('value').then((snap) => {
                if (snap.exists()) {
                    const room = snap.val();
                    db.ref('rooms/' + pin + '/playerJoined').set(true);
                    
                    document.getElementById('loading-text').innerText = "KẾT NỐI THÀNH CÔNG!";
                    setTimeout(() => {
                        // Chuyển trang sang Game tương ứng và truyền PIN vào URL
                        if (room.gameId == 1) {
                            window.location.href = `game1.html?room=${pin}&teams=${room.teamsCount}`;
                        } else {
                            window.location.href = `game2.html?room=${pin}&teams=${room.teamsCount}`;
                        }
                    }, 1000);
                } else {
                    document.getElementById('loading-screen').style.opacity = '0';
                    setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 300);
                    const err = document.getElementById('join-error');
                    err.innerText = 'Mã phòng không tồn tại!';
                    err.classList.remove('hidden');
                }
            });
        }
    </script>
</body>
</html>
