<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Sinh Tồn - Quiz Game</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="game2.css">
</head>
<body>
    <div class="game-container">
        <!-- HUD Header (Back & Progress) -->
        <header class="hud-top">
            <button class="btn-back" onclick="window.location.href='index.html'">← RỜI PHÒNG</button>
            <div class="hud-title">ĐẤU TRƯỜNG SINH TỒN</div>
            <div class="question-counter" id="question-counter">Câu: 1/5</div>
        </header>

        <div class="main-split">
            <!-- Left Teams -->
            <aside class="teams-side left" id="teams-left"></aside>

            <!-- Center Content -->
            <main class="center-content quiz-board">
                <div class="question-box">
                    <h2 id="question-text">Đang tải câu hỏi...</h2>
                </div>
                
                <div class="answers-grid" id="answers-grid">
                    <!-- Nút đáp án (A, B, C, D, E, F) -->
                    <div class="answer-card" id="ans-a"><span class="letter">A</span> <span class="text" id="text-a">...</span></div>
                    <div class="answer-card" id="ans-b"><span class="letter">B</span> <span class="text" id="text-b">...</span></div>
                    <div class="answer-card" id="ans-c"><span class="letter">C</span> <span class="text" id="text-c">...</span></div>
                    <div class="answer-card" id="ans-d"><span class="letter">D</span> <span class="text" id="text-d">...</span></div>
                    <div class="answer-card" id="ans-e"><span class="letter" style="background:#8e44ad;">E</span> <span class="text" id="text-e">...</span></div>
                    <div class="answer-card" id="ans-f"><span class="letter" style="background:#e84118;">F</span> <span class="text" id="text-f">...</span></div>
                </div>
            </main>

            <!-- Right Teams -->
            <aside class="teams-side right" id="teams-right"></aside>
        </div>


    </div>

    <!-- Popup Overlay (Success / Victory / GameOver) -->
    <div class="modal-overlay hidden" id="modal">
        <div class="modal-content spring-bounce">
            <h2 id="modal-title">...</h2>
            <p id="modal-text">...</p>
            <button class="pixel-btn" id="modal-btn" onclick="nextQuestion()">TIẾP TỤC</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="game2.js?v=3"></script>
</body>
</html>
