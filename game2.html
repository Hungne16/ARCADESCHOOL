<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Sinh Tồn - Quiz Game</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="game2.css">
</head>
<body>
    <div class="game-container">
        <!-- HUD Header (Back & Progress) -->
        <header class="hud-top">
            <button class="btn-back" onclick="window.location.href='index.html'">← RỜI PHÒNG</button>
            <div class="hud-title">ĐẤU TRƯỜNG SINH TỒN</div>
            <div class="question-counter" id="question-counter">Câu: 1/5</div>
        </header>

        <!-- Teams Dashboard -->
        <section class="teams-dashboard" id="teams-dashboard">
            <!-- Render bằng JS -->
        </section>

        <!-- Main Content -->
        <main class="quiz-board">
            <div class="question-box">
                <h2 id="question-text">Đang tải câu hỏi...</h2>
            </div>
            
            <div class="answers-grid" id="answers-grid">
                <!-- Nút đáp án (A, B, C, D) -->
                <div class="answer-card" id="ans-a"><span class="letter">A</span> <span class="text" id="text-a">...</span></div>
                <div class="answer-card" id="ans-b"><span class="letter">B</span> <span class="text" id="text-b">...</span></div>
                <div class="answer-card" id="ans-c"><span class="letter">C</span> <span class="text" id="text-c">...</span></div>
                <div class="answer-card" id="ans-d"><span class="letter">D</span> <span class="text" id="text-d">...</span></div>
            </div>
        </main>

        <!-- Teacher Panel (Chốt đáp án) - Đã chuyển sang admin.html -->
        <footer class="teacher-panel" style="display: none;">
            <h3 class="panel-title">GIÁO VIÊN: CHỐT ĐÁP ÁN CHO CÁC ĐỘI</h3>
            <div class="team-answers-container">
                <button class="team-ans-btn" id="t-ans-1" onclick="selectTeam(1)">Đội 1: <span id="t-val-1">?</span></button>
                <button class="team-ans-btn" id="t-ans-2" onclick="selectTeam(2)">Đội 2: <span id="t-val-2">?</span></button>
                <button class="team-ans-btn" id="t-ans-3" onclick="selectTeam(3)">Đội 3: <span id="t-val-3">?</span></button>
                <button class="team-ans-btn" id="t-ans-4" onclick="selectTeam(4)">Đội 4: <span id="t-val-4">?</span></button>
            </div>
            <div class="teacher-bottom-row">
                <div class="teacher-options" id="teacher-options">
                    <span>Chọn:</span>
                    <button class="opt-btn a" onclick="setAnswer('A')">A</button>
                    <button class="opt-btn b" onclick="setAnswer('B')">B</button>
                    <button class="opt-btn c" onclick="setAnswer('C')">C</button>
                    <button class="opt-btn d" onclick="setAnswer('D')">D</button>
                </div>
                <button class="btn-reveal" id="btn-reveal" onclick="revealAnswers()" disabled>CÔNG BỐ 🚀</button>
            </div>
        </footer>
    </div>

    <!-- Popup Overlay (Success / Victory / GameOver) -->
    <div class="modal-overlay hidden" id="modal">
        <div class="modal-content spring-bounce">
            <h2 id="modal-title">...</h2>
            <p id="modal-text">...</p>
            <button class="pixel-btn" id="modal-btn" onclick="nextQuestion()">TIẾP TỤC</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="game2.js?v=3"></script>
</body>
</html>
