<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trường Sinh Tồn - Pixel Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ffca28', 
                        secondary: '#29b6f6',
                        bgBase: '#2b2b2b'
                    },
                    fontFamily: {
                        'vt323': ['VT323', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="game2.css?v=5">
</head>
<body class="font-vt323 text-white h-screen flex flex-col overflow-hidden pixel-bg relative">
    
    <!-- Background Grass -->
    <div class="absolute bottom-0 left-0 right-0 h-[25vh] bg-green-500 border-t-8 border-green-700 z-0 pixel-grass"></div>

    <!-- Header -->
    <header class="flex justify-between items-center p-4 z-10">
        <button class="pixel-btn btn-yellow text-black text-2xl px-4 py-2 hover:brightness-110" onclick="window.location.href='index.html'">← RỜI PHÒNG</button>
        
        <div class="relative flex justify-center items-center mt-2">
            <div class="absolute -top-10 z-20 text-5xl drop-shadow-md">🏆</div>
            <div class="pixel-banner-blue text-4xl text-white px-8 py-2 shadow-pixel">★ ĐẤU TRƯỜNG SINH TỒN ★</div>
        </div>
        
        <div class="pixel-box bg-white text-black text-2xl px-4 py-2" id="question-counter">📋 Câu: 1/5</div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex gap-4 px-4 mt-2 z-10 w-full mb-14 h-[75vh]">
        
        <!-- Left Sidebar (Teams 1-3) -->
        <div class="w-56 flex flex-col gap-3 h-full overflow-y-auto hidden-scrollbar" id="teams-left">
            <!-- Rendered by JS -->
        </div>

        <!-- Center Question Board -->
        <div class="flex-1 relative flex flex-col items-center h-full">
            <!-- Chains -->
            <div class="absolute -top-8 left-1/4 w-4 h-12 bg-gray-300 pixel-chain z-0"></div>
            <div class="absolute -top-8 right-1/4 w-4 h-12 bg-gray-300 pixel-chain z-0"></div>
            
            <div class="bg-white w-full h-full pixel-border-blue relative flex flex-col items-center p-6 z-10 shadow-pixel-heavy text-black">
                <div class="pixel-label-blue text-white text-3xl px-8 py-1 absolute -top-5">CÂU HỎI</div>
                
                <div class="flex-1 flex items-center justify-center text-center w-full mt-2 overflow-y-auto">
                    <h2 id="question-text" class="text-3xl md:text-4xl leading-relaxed text-black font-bold">
                        Hệ thống bị khóa. Hãy tìm quy luật<br>của dãy số sau để mở cửa:<br>
                        <span class="text-red-600 text-5xl mt-2 inline-block">2, 6, 12, 20, 30, ?</span>
                    </h2>
                </div>
                
                <div class="pixel-label-blue text-white text-xl px-6 py-1 mt-1 mb-0 relative z-20 top-3">ĐÁP ÁN</div>
                <div class="w-full flex gap-4 mt-0 px-8 z-10 pb-2">
                    <input type="text" id="answer-input" class="flex-1 pixel-input text-2xl p-3 text-black focus:outline-none focus:bg-blue-50" placeholder="Nhập đáp án của đội...">
                    <button class="pixel-btn btn-yellow text-black text-2xl px-6 py-3 whitespace-nowrap hover:brightness-110" id="btn-submit">GỬI ĐÁP ÁN</button>
                </div>
            </div>
        </div>

        <!-- Right Sidebar (Stats & Teams 4-6) -->
        <div class="w-56 flex flex-col gap-4 h-full">
            <!-- Compact Stats -->
            <div class="flex gap-3">
                <div class="bg-white pixel-border-blue flex-1 flex flex-col items-center p-2 shadow-pixel-heavy relative justify-center h-20">
                    <div class="pixel-label-blue text-white text-xs px-2 py-1 absolute -top-3">THỜI GIAN</div>
                    <span class="text-4xl text-blue-700 font-bold leading-none mt-1" id="timer-text">30</span>
                </div>
                
                <div class="bg-white pixel-border-blue flex-1 flex flex-col items-center p-2 shadow-pixel-heavy relative justify-center h-20">
                    <div class="pixel-label-blue text-white text-xs px-2 py-1 absolute -top-3 whitespace-nowrap">ĐIỂM</div>
                    <div class="text-2xl text-black font-bold flex items-center gap-1 mt-1">
                        <span class="drop-shadow-md">🪙</span> 100
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col gap-3 flex-1 overflow-y-auto hidden-scrollbar" id="teams-right">
                <!-- Rendered by JS -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-blue-900 text-white flex justify-center items-center py-2 z-20 absolute bottom-0 w-full border-t-[6px] border-blue-950 shadow-[inset_0_4px_0_rgba(0,0,0,0.3)]">
        <div class="absolute left-10 bottom-1 text-5xl drop-shadow-lg">📚✏️</div>
        <div class="text-3xl text-yellow-300 font-bold tracking-widest text-shadow-pixel my-1">⭐ BÌNH TĨNH - TỰ TIN - CHIẾN THẮNG! ⭐</div>
        <div class="absolute right-10 bottom-1 text-5xl drop-shadow-lg">🎒🌱</div>
    </footer>

    <!-- Modal overlay (hidden by default) -->
    <div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden backdrop-blur-sm" id="modal">
        <div class="bg-white pixel-border-blue p-8 flex flex-col items-center text-center max-w-2xl spring-bounce shadow-pixel-heavy">
            <h2 id="modal-title" class="text-6xl mb-4 text-green-600 font-bold">...</h2>
            <p id="modal-text" class="text-4xl mb-8 text-black">...</p>
            <button class="pixel-btn btn-yellow text-black text-4xl px-10 py-3" onclick="nextQuestion()">TIẾP TỤC</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="game2.js?v=5"></script>
</body>
</html>
