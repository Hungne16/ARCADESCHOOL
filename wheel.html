<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Arcade School</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=VT323&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'vt323': ['VT323', 'monospace'],
                        'montserrat': ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="wheel.css">
</head>
<body class="bg-gray-900 text-white min-h-screen overflow-x-hidden relative font-vt323">
    
    <div class="bg-gradient"></div>
    <div class="crt-overlay z-10 pointer-events-none fixed inset-0"></div>

    <!-- Nút trở về -->
    <button onclick="window.location.href='index.html'" class="fixed top-4 left-4 z-20 px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded text-2xl border-2 border-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.8)] transition-transform hover:scale-105">
        ⬅ VỀ SẢNH
    </button>

    <div class="container mx-auto px-4 py-8 z-20 relative min-h-screen flex flex-col items-center">
        
        <h1 class="glow-title text-5xl md:text-7xl mb-8 mt-12 text-center uppercase font-montserrat">VÒNG QUAY MAY MẮN</h1>

        <div class="flex flex-col lg:flex-row gap-12 w-full max-w-6xl items-center lg:items-start justify-center mt-4">
            
            <!-- Khu vực Vòng Quay -->
            <div class="wheel-container relative w-[350px] h-[350px] md:w-[500px] md:h-[500px] flex-shrink-0">
                <canvas id="wheel-canvas" class="w-full h-full rounded-full shadow-[0_0_50px_rgba(255,0,255,0.4)]"></canvas>
                <div class="wheel-pointer absolute top-0 left-1/2 -translate-x-1/2 -translate-y-4 w-12 h-16 bg-pink-500" style="clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 30;"></div>
                <div class="wheel-center-dot absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 bg-gray-800 border-4 border-cyan-400 rounded-full shadow-[0_0_20px_rgba(34,211,238,0.8)] flex items-center justify-center cursor-pointer hover:scale-110 transition-transform z-30" onclick="spinWheel()">
                    <span class="text-3xl text-cyan-400 animate-pulse mt-1">SPIN</span>
                </div>
            </div>

            <!-- Khu vực Cài Đặt -->
            <div class="config-container bg-gray-800 border-4 border-pink-500 rounded-xl p-6 w-full max-w-md shadow-[0_0_30px_rgba(236,72,153,0.3)]">
                
                <!-- Chế độ -->
                <div class="flex justify-center gap-4 mb-6 text-3xl">
                    <button id="mode-student" onclick="setMode('student')" class="mode-btn active-mode px-4 py-2 rounded border-2 border-pink-500 text-pink-400">HỌC SINH</button>
                    <button id="mode-question" onclick="setMode('question')" class="mode-btn px-4 py-2 rounded border-2 border-transparent text-gray-400 hover:text-white">CÂU HỎI</button>
                </div>

                <!-- Ô nhập liệu -->
                <div class="mb-4">
                    <div class="flex justify-between items-end mb-2">
                        <label id="input-label" class="block text-2xl text-cyan-400">Nhập danh sách học sinh (mỗi dòng 1 tên):</label>
                        <label class="bg-green-600 hover:bg-green-500 text-white text-xl px-3 py-1 rounded cursor-pointer border-b-2 border-green-800 active:border-b-0 active:mt-0.5 transition-all whitespace-nowrap ml-2">
                            📁 Excel
                            <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">
                        </label>
                    </div>
                    <textarea id="item-input" rows="8" class="w-full bg-gray-900 border-2 border-cyan-500 rounded p-4 text-2xl font-sans focus:outline-none focus:border-pink-500 text-green-400" placeholder="Nguyễn Văn A&#10;Trần Thị B..."></textarea>
                </div>

                <div class="flex gap-4">
                    <button onclick="updateWheel()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white text-3xl py-3 rounded border-b-4 border-cyan-800 active:border-b-0 active:mt-1 transition-all">CẬP NHẬT</button>
                    <button onclick="clearList()" class="bg-red-600 hover:bg-red-500 text-white text-3xl px-6 py-3 rounded border-b-4 border-red-800 active:border-b-0 active:mt-1 transition-all">XÓA</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Kết quả -->
    <div id="result-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex justify-center items-center backdrop-blur-sm">
        <div class="bg-gray-800 border-4 border-green-500 rounded-2xl p-10 max-w-2xl w-[90%] text-center shadow-[0_0_50px_rgba(34,197,94,0.6)] transform scale-0 transition-transform duration-300" id="result-box">
            <h2 id="result-title" class="text-4xl text-yellow-400 mb-6 uppercase">🎉 XIN CHÚC MỪNG 🎉</h2>
            <div id="result-text" class="text-5xl md:text-6xl text-white font-montserrat font-bold mb-10 break-words drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">Tên Người Trúng</div>
            <div class="flex justify-center gap-6">
                <button onclick="closeModal()" class="px-8 py-4 bg-gray-600 hover:bg-gray-500 text-3xl rounded border-b-4 border-gray-800">ĐÓNG</button>
                <button onclick="removeWinner()" class="px-8 py-4 bg-red-600 hover:bg-red-500 text-3xl rounded border-b-4 border-red-800 text-white">XÓA KHỎI VÒNG</button>
            </div>
        </div>
    </div>
    
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-40 w-full h-full"></canvas>

    <script src="wheel.js"></script>
</body>
</html>
