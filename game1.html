<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mật Mã Học Đường - Escape Room</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="game1.css">
</head>
<body>
    <div class="crt-overlay"></div>

    <div class="game-container">
        <!-- HUD Header (Back & Timer) -->
        <header class="hud-top">
            <button class="btn-back" onclick="window.location.href='index.html'">← RỜI PHÒNG</button>
            <div class="timer" id="timer">10:00</div>
        </header>

        <!-- Teams Dashboard -->
        <section class="teams-dashboard" id="teams-dashboard">
            <!-- Render bằng JS -->
        </section>

        <!-- Main Content -->
        <main class="terminal">
            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="terminal-title">SYSTEM.EXE</span>
            </div>
            <div class="terminal-body" id="puzzle-container">
                <!-- Nội dung câu hỏi sẽ được inject vào đây bằng JS -->
            </div>
        </main>

        <!-- Inventory / Passcode -->
        <footer class="inventory">
            <h3>MÃ BÍ MẬT THU THẬP:</h3>
            <div class="slots">
                <div class="slot" id="slot-1">?</div>
                <div class="slot" id="slot-2">?</div>
                <div class="slot" id="slot-3">?</div>
            </div>
        </footer>
    </div>

    <!-- Popup Overlay (Success / Victory / GameOver) -->
    <div class="modal-overlay hidden" id="modal">
        <div class="modal-content spring-bounce">
            <h2 id="modal-title">THÀNH CÔNG!</h2>
            <p id="modal-text">Bạn đã nhận được mảnh ghép.</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="game1.js?v=3"></script>
</body>
</html>
